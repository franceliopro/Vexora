<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento</title><link rel="stylesheet" href="/site-chat.css"></head><body><header><strong id="title">Atendimento</strong><small>Converse com nossa equipe</small></header><main id="messages" aria-live="polite"></main><p id="status" role="status"></p><form id="start"><label>Como podemos chamar você?<input name="name" required maxlength="120" autocomplete="given-name"></label><label>E-mail (opcional)<input name="email" type="email" autocomplete="email"></label><small>Ao iniciar, você compartilha seus dados e mensagens com a empresa para este atendimento.</small><button>Iniciar conversa</button></form><form id="send" hidden><label class="sr-only" for="text">Sua mensagem</label><textarea id="text" rows="2" maxlength="4000" required placeholder="Escreva sua mensagem…"></textarea><button>Enviar</button></form><script src="/site-chat-client.js"></script></body></html>
