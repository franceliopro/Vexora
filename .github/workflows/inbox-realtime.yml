name: Inbox real-time regression
on:
  push:
    branches:
      - main
      - fix/inbox-realtime-sync
      - fix/baileys-fast-media-inbox
      - feat/attendance-presence-release-policy
    paths:
      - 'web/index.html'
      - 'web/realtime.js'
      - 'src/server.js'
      - 'src/core.js'
      - 'src/db.js'
      - 'src/drivers/baileys.js'
      - 'src/attendance-management.js'
      - 'src/bus.js'
      - 'web/attendance.js'
      - 'web/integrations.js'
      - 'src/drivers/waha.js'
      - 'src/module-access.js'
      - 'test/module-access.mjs'
      - 'test/inbox-realtime-sync.mjs'
      - 'test/ai-provider-config.mjs'
      - '.github/workflows/inbox-realtime.yml'
  pull_request:
    paths:
      - 'web/index.html'
      - 'web/realtime.js'
      - 'src/server.js'
      - 'src/core.js'
      - 'src/drivers/baileys.js'
      - 'src/drivers/waha.js'
      - 'src/module-access.js'
      - 'web/features.js'
      - 'web/suite-groups.js'
      - 'web/campaigns.js'
      - 'web/outreach.js'
      - 'web/campaigns.css'
      - 'web/communications.css'
      - 'test/module-access.mjs'
      - 'src/attendance-management.js'
      - 'src/bus.js'
      - 'web/attendance.js'
      - 'web/integrations.js'
      - 'test/inbox-realtime-sync.mjs'
      - 'test/ai-provider-config.mjs'
      - '.github/workflows/inbox-realtime.yml'
jobs:
  inbox-realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server and transport syntax
        run: |
          node --check src/server.js
          node --check src/core.js
          node --check src/db.js
          node --check src/drivers/baileys.js
          node --check src/drivers/waha.js
          node --check src/module-access.js
          node --check web/features.js
          node --check web/suite-groups.js
          node --check web/campaigns.js
          node --check web/outreach.js
          node --check src/attendance-management.js
          node --check web/integrations.js
          node --check web/attendance.js
          node --check web/realtime.js
      - name: Verify inbox real-time synchronization
        run: node test/inbox-realtime-sync.mjs
      - name: Verify module access and tenant entitlements
        run: node test/module-access.mjs
      - name: Verify WAHA and Gemini provider configuration
        run: node test/ai-provider-config.mjs
