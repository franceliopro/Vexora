# Compatibilidade de instalações existentes: defina POSTGRES_USER/POSTGRES_DB no .env.
# Vexora — 1 stack = N empresas isoladas (tenant_id + Row Level Security).
# Serve para Dokploy, Portainer (Repository) ou `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_KEY: ${PLATFORM_KEY}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      ASTRA_CALLS_URL: ${ASTRA_CALLS_URL:-}
      ASTRA_CALLS_API_KEY: ${ASTRA_CALLS_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL}
      GCAL_CLIENT_ID: ${GCAL_CLIENT_ID:-}
      GCAL_CLIENT_SECRET: ${GCAL_CLIENT_SECRET:-}
      GCAL_REFRESH_TOKEN: ${GCAL_REFRESH_TOKEN:-}
      GCAL_CALENDAR_ID: ${GCAL_CALENDAR_ID:-primary}
    ports: ["${APP_PORT:-3100}:3000"]
    volumes: [appdata:/data]
    depends_on: [db]
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment: {POSTGRES_USER: "${POSTGRES_USER:-nexora}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB:-nexora}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, retries: 10}
  # WhatsApp gerenciado pela própria stack: não exige instalação manual do WAHA.
  # O padrão NOWEB evita depender de um navegador; a imagem pode ser fixada no
  # Dokploy definindo WAHA_IMAGE, sem alterar o código da aplicação.
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "${WAHA_KEY}"
      WHATSAPP_API_KEY: "${WAHA_KEY}"
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes: [wahadata:/app/.sessions]
    # Sem ports: o WAHA só é acessível pela rede interna do Compose.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  pgadmin:   # interface gráfica do banco. Por padrão só acessível no próprio servidor (127.0.0.1) — veja o README.
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vexora.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports: ["${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"]
    volumes: ["./pgadmin/servers.json:/pgadmin4/servers.json:ro", "pgadmindata:/var/lib/pgadmin"]
    depends_on: [db]
  backup:    # dump automático do banco todo dia (guarda 7 diários, 4 semanais, 3 mensais) no volume "backups"
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment: {POSTGRES_HOST: db, POSTGRES_DB: "${POSTGRES_DB:-nexora}", POSTGRES_USER: "${POSTGRES_USER:-nexora}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", SCHEDULE: "@daily", BACKUP_KEEP_DAYS: "7", BACKUP_KEEP_WEEKS: "4", BACKUP_KEEP_MONTHS: "3"}
    volumes: ["backups:/backups"]
    depends_on: [db]
volumes: {appdata: {}, pgdata: {}, wahadata: {}, pgadmindata: {}, backups: {}}

